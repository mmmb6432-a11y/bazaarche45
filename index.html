<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>بازار نیمروز</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>بازار نیمروز</b><small>خرید و فروش آسان در نیمروز</small></div><button id="accountBtn">👤</button></header>
<main>
<section id="home" class="view active"><input id="search" placeholder="جستجو در آگهی‌ها..."><div id="cats"></div><div class="head"><h2>آگهی‌های تازه</h2><select id="sort"><option value="new">جدیدترین</option><option value="cheap">ارزان‌ترین</option><option value="expensive">گران‌ترین</option></select></div><div id="ads" class="grid"></div></section>
<section id="post" class="view"><div class="card"><h2>ثبت آگهی</h2><label>عنوان<input id="title" maxlength="80" placeholder="مثلاً گوشی Poco X3"></label><label>دسته<select id="category"></select></label><label>قیمت افغانی<input id="price" type="number" min="0"></label><label>منطقه<input id="location" placeholder="مثلاً زرنج، اتفاق آباد"></label><label>توضیحات<textarea id="desc"></textarea></label><label>عکس<input id="photo" type="file" accept="image/*"></label><button id="publish" class="primary">انتشار آگهی</button><p id="msg"></p></div></section>
<section id="saved" class="view"><h2>ذخیره‌شده‌ها</h2><div id="savedAds" class="grid"></div></section>
<section id="account" class="view"><div class="card"><h2>حساب کاربری</h2><div id="accountContent"></div></div><div class="card"><h3>آگهی‌های من</h3><div id="myAds" class="grid"></div></div></section>
</main><nav><button data-v="home">⌂<span>خانه</span></button><button data-v="post">＋<span>ثبت آگهی</span></button><button data-v="saved">♡<span>ذخیره</span></button><button data-v="account">👤<span>حساب</span></button></nav>
<div id="modal" class="modal hidden"><div class="modalbox"><button id="close">×</button><div id="detail"></div></div></div><script src="app.js"></script></body></html>
